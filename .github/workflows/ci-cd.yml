name: Build and Deploy Quarto Notebook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev

      - name: Install notebook dependencies
        run: |
          Rscript -e "install.packages(c('knitr','rmarkdown','tidyverse','visNetwork','igraph','httr','dotenv','ggfortify','VennDiagram'))"
          Rscript -e "pkgs <- c('knitr','rmarkdown','tidyverse','visNetwork','igraph','httr','dotenv','ggfortify','VennDiagram'); stopifnot(all(vapply(pkgs, requireNamespace, quietly=TRUE, FUN.VALUE=logical(1))))"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Prepare repository dataset
        run: |
          rm -rf data .ci-data
          mkdir -p data .ci-data
          unzip -q compressed_data/data.zip -d .ci-data
          BASE_CSV="$(find .ci-data -type f -name 'Base.csv' -print -quit)"
          if [ -z "$BASE_CSV" ]; then
            echo "Base.csv was not found inside compressed_data/data.zip"
            exit 1
          fi
          cp "$BASE_CSV" data/Base.csv
          test -s data/Base.csv

      - name: Prepare CI-safe notebook
        working-directory: code
        run: Rscript prepare_ci_notebook.R

      - name: Execute and render Quarto notebook
        working-directory: code
        env:
          CI: 'true'
        run: |
          quarto render code-ci.qmd --execute --output-dir ../_site
          if [ -f ../_site/code/index.html ]; then
            cp -a ../_site/code/. ../_site/
          fi
          test -f ../_site/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
