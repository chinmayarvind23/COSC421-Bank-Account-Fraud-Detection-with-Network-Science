name: Build and Deploy Quarto Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - name: Install system dependency for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev

      - name: Install Quarto rendering dependencies
        run: |
          Rscript -e "install.packages(c('knitr', 'rmarkdown'))"
          Rscript -e "stopifnot(requireNamespace('knitr', quietly=TRUE), requireNamespace('rmarkdown', quietly=TRUE))"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Make notebook source CI-safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('code/code.qmd')
          text = path.read_text()

          # Remove local environment/package-management side effects from the
          # deployment copy. Package installation belongs in this workflow.
          text = re.sub(r'^\s*renv::.*\n?', '', text, flags=re.MULTILINE)
          text = re.sub(r'^\s*source\(["\']\.\./renv/activate\.R["\']\).*\n?', '', text, flags=re.MULTILINE)
          text = re.sub(r'^\s*install\.packages\(.*\)\s*\n?', '', text, flags=re.MULTILINE)

          # Make the data reference portable instead of machine-specific.
          text = text.replace(
              '/Users/chinmayarvind/Documents/UBC/UBC Coursework/COSC 421/Course Project/Bank-Account-Fraud-Detection-with-Network-Science/data/Base.csv',
              '../data/Base.csv'
          )
          text = text.replace(
              '/Users/chinmayarvind/Documents/UBC/UBC Coursework/COSC 421/Course Project/Bank-Account-Fraud-Detection-with-Network-Science/.env',
              '../.env'
          )

          path.write_text(text)
          PY

      - name: Render Quarto notebook
        working-directory: code
        run: |
          quarto render code.qmd --no-execute --output-dir ../_site
          test -f ../_site/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
